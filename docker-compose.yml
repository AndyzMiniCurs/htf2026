services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: htf
      POSTGRES_PASSWORD: htf
      POSTGRES_DB: htf
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U htf -d htf"]
      interval: 2s
      retries: 15

  # One-shot: creates/updates the schema and seeds demo data only into an empty database.
  migrate:
    build:
      context: ./app
      target: build
    profiles: ["full"]
    command: ["npm", "run", "db:init"]
    environment:
      DATABASE_URL: postgresql://htf:htf@db:5432/htf
    depends_on:
      db:
        condition: service_healthy

  app:
    build: ./app
    profiles: ["full"] # dev runs the app locally with `npm run dev`; `docker compose --profile full up` runs everything
    # AI keys (TYPESAFE_API_KEY, OPENROUTER_API_KEY) come from the same file `npm run dev` reads.
    env_file:
      - path: ./app/.env
        required: false
    environment:
      DATABASE_URL: postgresql://htf:htf@db:5432/htf
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
