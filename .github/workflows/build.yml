name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: htf
          POSTGRES_PASSWORD: htf
          POSTGRES_DB: htf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U htf -d htf" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgresql://htf:htf@localhost:5432/htf
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Push schema
        run: npm run db:push
      - name: Test
        run: npm test
      # Lint stays local for now: typescript-eslint crashes on TypeScript 6 in require-await.
      - name: Build
        run: npm run build