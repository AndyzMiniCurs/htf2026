schema: spec-driven

context: |
  Hackathon project (Hack The Future 2026, challenge "Guardians of the Grid", sponsor Optis).
  Goal: realtime mission control dashboard - live key stats, early anomaly detection, operator insights.
  Deadline: demo/pitch at 16:00 the same day. Prefer the smallest thing that demos well.
  Most users open the app on phones (iOS/Android): frontend is mobile-first, desktop second.
  Stack is fixed: TypeScript, React, PostgreSQL, TanStack Start/Router, Drizzle ORM, Tailwind, lucide-react.
  The app lives in app/ and is the official Optis starter switched from SQLite to Postgres.
  Base assignment, optional extensions and judging (Creativity 40%, Functionality 30%, Presentation 30%) are in CHALLENGE.md;
  the data model (Glitch, Echo, Guardian) is datamodel.png. Postgres runs from docker-compose.yml at repo root.
  Two devs split the work:
    - backend owner: app/src/db/** (schema, seed), app/src/lib/*.functions.ts (createServerFn server functions)
    - frontend owner: app/src/routes/**, app/src/components/**, styling
    - shared contract: app/src/lib/<domain>.ts (types + constants, like lib/glitch.ts). Specify those first.
  Follow the starter's conventions: `#/` imports, server functions in lib/<domain>.functions.ts, UI in components/ui.

rules:
  proposal:
    - State which side owns the change (backend, frontend, or both) and what is out of scope
  design:
    - List every server function / HTTP endpoint with its input and output TypeScript types
  tasks:
    - Prefix every task with [BE] or [FE] so the two devs can pick tasks without overlap
    - Keep tasks under 1 hour each
